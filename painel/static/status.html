<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d12">
<title>Status — Servidor Palworld</title>
<link rel="icon" href="/logo.jpg">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0d12; color: #e9eef5;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
}
.card {
  background: #11161d; border: 1px solid #212b38; border-radius: 18px;
  padding: 2rem; max-width: 460px; width: 100%; text-align: center;
}
.logo { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; }
h1 { font-size: 1.25rem; margin: 0.9rem 0 0.15rem; }
.sub { color: #8da0af; font-size: 0.85rem; }
.estado {
  display: inline-flex; align-items: center; gap: 0.5rem;
  margin: 1.2rem auto 0.3rem; font-weight: 700; font-size: 1.05rem;
}
.dot { width: 12px; height: 12px; border-radius: 50%; background: #5d6d7d; }
.on .dot { background: #3ecf8e; box-shadow: 0 0 0 4px rgba(62,207,142,.18); animation: pulso 2s infinite; }
.off .dot { background: #e5534b; box-shadow: 0 0 0 4px rgba(229,83,75,.14); }
@keyframes pulso { 50% { box-shadow: 0 0 0 8px rgba(62,207,142,.08); } }
.grade {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
  margin-top: 1.2rem; text-align: left;
}
.item {
  background: #161d27; border: 1px solid #212b38; border-radius: 12px;
  padding: 0.65rem 0.8rem;
}
.item span { display: block; font-size: 0.66rem; text-transform: uppercase;
             letter-spacing: 0.07em; color: #5d6d7d; margin-bottom: 0.15rem; }
.item b { font-size: 1.05rem; }
.conectar {
  margin-top: 1.2rem; background: rgba(69,196,173,.1);
  border: 1px solid rgba(69,196,173,.35); border-radius: 12px;
  padding: 0.75rem 0.9rem; font-family: ui-monospace, monospace;
  word-break: break-all;
}
.conectar small { display: block; font-family: inherit; color: #45c4ad;
                  letter-spacing: 0.06em; text-transform: uppercase;
                  font-size: 0.62rem; margin-bottom: 0.25rem; }
.rodape { margin-top: 1.1rem; font-size: 0.72rem; color: #5d6d7d; }
</style>
</head>
<body>
<div class="card" id="cartao">
  <img class="logo" src="/logo.jpg" alt="">
  <h1 id="nome">Servidor de Palworld</h1>
  <p class="sub">Status público em tempo quase real</p>
  <div class="estado off" id="estado">
    <span class="dot"></span><span id="estado-txt">Verificando…</span>
  </div>
  <div class="grade">
    <div class="item"><span>Jogadores</span><b id="jog">—</b></div>
    <div class="item"><span>Versão</span><b id="ver" style="font-size:.9rem">—</b></div>
  </div>
  <div class="conectar" id="conecta-wrap" hidden>
    <small>Endereço para conectar (Steam)</small>
    <span id="conecta">—</span>
  </div>
  <p class="rodape" id="atualizado"></p>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
async function atualizar() {
  try {
    const r = await fetch("/api/public/status", { cache: "no-cache" });
    if (!r.ok) throw new Error();
    const d = await r.json();
    $("#estado").className = "estado " + (d.online ? "on" : "off");
    $("#estado-txt").textContent = d.online ? "Online" : "Offline";
    document.title = (d.online ? "✅ " : "⛔ ") + (d.nome || "Servidor Palworld");
    $("#nome").textContent = d.nome || "Servidor de Palworld";
    $("#jog").textContent = d.online && d.jogadores != null
      ? `${d.jogadores} / ${d.capacidade ?? "?"}` : "—";
    $("#ver").textContent = d.versao || "—";
    const wrap = $("#conecta-wrap");
    if (d.conectar) {
      $("#conecta").textContent = d.conectar;
      wrap.hidden = false;
    }
    $("#atualizado").textContent = d.atualizado_em
      ? "atualizado às " + new Date(d.atualizado_em * 1000).toLocaleTimeString("pt-BR")
      : "";
  } catch (_) {
    $("#estado").className = "estado off";
    $("#estado-txt").textContent = "Indisponível";
  }
}
atualizar();
setInterval(atualizar, 15000);
</script>
</body>
</html>
