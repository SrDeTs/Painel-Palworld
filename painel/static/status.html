<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Status — Servidor Palworld</title>
<link rel="icon" href="/logo.jpg">
<style>
:root {
  color-scheme: dark;
  --bg: #07111f;
  --bg2: #0a1c30;
  --panel: rgba(12, 27, 45, .82);
  --panel2: rgba(18, 39, 62, .78);
  --line: rgba(139, 218, 255, .16);
  --text: #eef8ff;
  --muted: #8ea9bc;
  --cyan: #64e2f2;
  --blue: #69a8ff;
  --gold: #f5c86a;
  --coral: #ff856f;
  --ok: #61dfae;
  --bad: #ff776f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(circle at 12% 8%, rgba(100,226,242,.14), transparent 28rem),
    radial-gradient(circle at 88% 18%, rgba(105,168,255,.13), transparent 30rem),
    radial-gradient(circle at 50% 110%, rgba(245,200,106,.08), transparent 32rem),
    linear-gradient(145deg, var(--bg), var(--bg2));
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .28;
  background-image:
    linear-gradient(rgba(139,218,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,218,255,.045) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at center, #000, transparent 85%);
}
.card {
  position: relative; isolation: isolate;
  background: linear-gradient(155deg, rgba(20,44,69,.84), rgba(8,22,38,.88));
  border: 1px solid var(--line); border-radius: 28px;
  padding: 2rem; max-width: 500px; width: 100%; text-align: center;
  box-shadow: 0 28px 90px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.05);
  backdrop-filter: blur(22px) saturate(130%);
}
.card::before {
  content: ""; position: absolute; z-index: -1; inset: 0; border-radius: inherit;
  background: radial-gradient(circle at 24% 0%, rgba(100,226,242,.11), transparent 42%);
}
.logo {
  width: 88px; height: 88px; border-radius: 24px; object-fit: cover;
  border: 1px solid rgba(100,226,242,.25);
  box-shadow: 0 14px 44px rgba(0,0,0,.3), 0 0 38px rgba(100,226,242,.09);
}
h1 { font-size: 1.32rem; margin: 1rem 0 0.18rem; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 0.85rem; }
.estado {
  display: inline-flex; align-items: center; gap: 0.55rem;
  margin: 1.35rem auto 0.45rem; font-weight: 750; font-size: 1.05rem;
  padding: .55rem .85rem; border-radius: 999px;
  background: rgba(255,255,255,.035); border: 1px solid var(--line);
}
.dot { width: 11px; height: 11px; border-radius: 50%; background: #607487; }
.on .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(97,223,174,.16), 0 0 20px rgba(97,223,174,.35); animation: pulso 2s infinite; }
.off .dot { background: var(--bad); box-shadow: 0 0 0 4px rgba(255,119,111,.13); }
@keyframes pulso { 50% { box-shadow: 0 0 0 8px rgba(97,223,174,.06), 0 0 24px rgba(97,223,174,.22); } }
.grade {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem;
  margin-top: 1.25rem; text-align: left;
}
.item {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 15px;
  padding: 0.78rem 0.9rem; box-shadow: inset 0 1px rgba(255,255,255,.035);
}
.item span { display: block; font-size: 0.64rem; text-transform: uppercase;
             letter-spacing: 0.09em; color: var(--muted); margin-bottom: 0.18rem; }
.item b { font-size: 1.08rem; }
.conectar {
  margin-top: 1.2rem; background: rgba(100,226,242,.075);
  border: 1px solid rgba(100,226,242,.22); border-radius: 15px;
  padding: 0.85rem 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  word-break: break-all; box-shadow: inset 0 1px rgba(255,255,255,.03);
}
.conectar small { display: block; font-family: inherit; color: var(--cyan);
                  letter-spacing: 0.08em; text-transform: uppercase;
                  font-size: 0.61rem; margin-bottom: 0.3rem; }
.rodape { margin-top: 1.2rem; font-size: 0.72rem; color: var(--muted); }
@media (max-width: 520px) {
  body { padding: 1rem; }
  .card { border-radius: 22px; padding: 1.45rem; }
  .grade { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="card" id="cartao">
  <img class="logo" src="/logo.jpg" alt="">
  <h1 id="nome">Servidor de Palworld</h1>
  <p class="sub">Status público em tempo quase real</p>
  <div class="estado off" id="estado">
    <span class="dot"></span><span id="estado-txt">Verificando…</span>
  </div>
  <div class="grade">
    <div class="item"><span>Jogadores</span><b id="jog">—</b></div>
    <div class="item"><span>Versão</span><b id="ver" style="font-size:.9rem">—</b></div>
  </div>
  <div class="conectar" id="conecta-wrap" hidden>
    <small>Endereço para conectar (Steam)</small>
    <span id="conecta">—</span>
  </div>
  <p class="rodape" id="atualizado"></p>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
async function atualizar() {
  try {
    const r = await fetch("/api/public/status", { cache: "no-cache" });
    if (!r.ok) throw new Error();
    const d = await r.json();
    $("#estado").className = "estado " + (d.online ? "on" : "off");
    $("#estado-txt").textContent = d.online ? "Online" : "Offline";
    document.title = (d.online ? "✅ " : "⛔ ") + (d.nome || "Servidor Palworld");
    $("#nome").textContent = d.nome || "Servidor de Palworld";
    $("#jog").textContent = d.online && d.jogadores != null
      ? `${d.jogadores} / ${d.capacidade ?? "?"}` : "—";
    $("#ver").textContent = d.versao || "—";
    const wrap = $("#conecta-wrap");
    if (d.conectar) {
      $("#conecta").textContent = d.conectar;
      wrap.hidden = false;
    }
    $("#atualizado").textContent = d.atualizado_em
      ? "atualizado às " + new Date(d.atualizado_em * 1000).toLocaleTimeString("pt-BR")
      : "";
  } catch (_) {
    $("#estado").className = "estado off";
    $("#estado-txt").textContent = "Indisponível";
  }
}
atualizar();
setInterval(atualizar, 15000);
</script>
</body>
</html>
